function makeSky(){
 const geo=new THREE.SphereGeometry(80,48,32);
 const mat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{uTime:{value:0}},vertexShader:`varying vec3 vLocal; void main(){vLocal=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec3 vLocal; uniform float uTime;
 float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
 float noise21(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash21(i),hash21(i+vec2(1.0,0.0)),f.x),mix(hash21(i+vec2(0.0,1.0)),hash21(i+vec2(1.0)),f.x),f.y);}

 const sky=new THREE.Mesh(geo,mat);scene.add(sky);return mat;
}

function init(){
 scene=new THREE.Scene();scene.fog=new THREE.FogExp2('#160b13',.018);

 composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.48,.65,.72);composer.addPass(bloom);composer.addPass(new OutputPass());
 clock=new THREE.Clock();window.addEventListener('resize',onResize);document.getElementById('wind-slider').addEventListener('input',e=>{wind=Number(e.target.value);document.getElementById('wind-value').textContent=wind.toFixed(2)+'×';if(audioNodes)audioNodes.filter.frequency.setTargetAtTime(180+wind*135,audioCtx.currentTime,.15);});
 document.getElementById('pause-btn').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume motion':'Pause motion';if(paused)clock.stop();else clock.start();});

function onResize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);}
function updateCloth(t){for(const item of animatedCloth){const pos=item.geo.attributes.position;let k=0;for(let j=0;j<=item.ny;j++){const r=j/item.ny;for(let i=0;i<=item.nx;i++){const u=i/item.nx*2-1;const p=clothPoint(u,r,t,wind);pos.setXYZ(k++,p[0],p[1],p[2]);}}pos.needsUpdate=true;item.geo.computeVertexNormals();}}
function updateBadges(t){for(const b of badges){const p=clothPoint(b.u,b.r,t,wind);b.g.position.set(p[0],b.y,p[2]+.12);b.g.rotation.y=Math.sin(t*2+b.x*2)*.025*wind;b.g.rotation.z=Math.sin(t*1.5+b.y)*.025*wind;}}
function updateWindLines(t,dt){for(const o of windLines){const p=o.line.geometry.attributes.position;for(let i=0;i<o.count;i++){const u=i/(o.count-1);const x=(u-.5)*o.span+Math.sin(t*o.speed+o.phase)*.55*wind;const curl=curlNoise2D(u*2.6+t*.09,o.y*.36+o.phase);const y=o.y+Math.sin(u*7+t*1.2+o.phase)*o.amp*wind+Math.sin(u*14-t*.7+o.seed)*o.05+curl[0]*wind*.8;const z=o.z+Math.sin(u*9+t*.65+o.seed)*.38*wind+curl[1]*wind*.8;p.setXYZ(i,x,y,z);}p.needsUpdate=true;o.line.material.opacity=(.10+(.07*Math.sin(t*.5+o.phase)))*(0.35+wind*.45);}}

function animate(){requestAnimationFrame(animate);if(!renderer)return;let dt=Math.min(clock.getDelta(),.04);if(paused)dt=0;const t=clock.elapsedTime;if(skyMaterial)skyMaterial.uniforms.uTime.value=t;controls.update();updateCloth(t);updateBadges(t);updateWindLines(t,dt);updateEmbers(t,dt);composer.render();}
async function toggleAudio(){const btn=document.getElementById('audio-btn');try{if(audioNodes){audioNodes.gain.gain.setTargetAtTime(0,audioCtx.currentTime,.12);setTimeout(()=>{if(audioNodes){try{audioNodes.source.stop()}catch{}audioNodes=null;}},240);btn.textContent='Wind audio off';btn.setAttribute('aria-pressed','false');return;}audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const size=audioCtx.sampleRate*3,buffer=audioCtx.createBuffer(1,size,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<size;i++)data[i]=(Math.random()*2-1)*(.5+Math.random()*.5);const source=audioCtx.createBufferSource();source.buffer=buffer;source.loop=true;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=180+wind*135;filter.Q.value=.65;const gain=audioCtx.createGain();gain.gain.value=0;source.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);source.start();gain.gain.setTargetAtTime(.12,audioCtx.currentTime,.8);audioNodes={source,filter,gain};btn.textContent='Wind audio on';btn.setAttribute('aria-pressed','true');}catch(e){btn.textContent='Audio unavailable';console.warn(e);}}
